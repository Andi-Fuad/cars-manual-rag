version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: car_manual_db
    environment:
      POSTGRES_USER: ${DB_USER:-rag_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-rag_password}
      POSTGRES_DB: ${DB_NAME:-car_manual_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-rag_user} -d ${DB_NAME:-car_manual_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rag_network

  rag_api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: car_manual_rag_api
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-car_manual_db}
      DB_USER: ${DB_USER:-rag_user}
      DB_PASSWORD: ${DB_PASSWORD:-rag_password}
    ports:
      - "8000:8000"
    volumes:
      - .:/app:cached
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - rag_network
    command: python -m uvicorn routes.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:

networks:
  rag_network:
    driver: bridge